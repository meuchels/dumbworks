name: Build

# Builds the standalone m40scan-x86_64 executable.
# - Every push: the file is available under the run's "Artifacts" (Actions tab).
# - Pushing a tag like v0.2.0: also creates a GitHub Release with the file attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: the build env comes from conda-forge, so the host OS only needs to be stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache build environment
        uses: actions/cache@v5
        with:
          path: packaging/.build/env
          key: env-${{ hashFiles('packaging/build.sh') }}

      - name: Build
        run: packaging/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: m40scan-x86_64
          path: dist/m40scan-x86_64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/m40scan-x86_64
          prerelease: true
          generate_release_notes: true
